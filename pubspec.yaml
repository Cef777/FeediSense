name: feedisense
description: A Flutter application for the FeediSense project.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Updated telephony plugin to include the SmsManager fix (PR #153).
  another_telephony: ^0.5.0-pre.1

  # Other required project dependencies
  permission_handler: ^11.3.1
  share_plus: ^10.1.0
  fl_chart: ^0.69.0
  intl: ^0.19.0
  path_provider: ^2.1.3
  flutter_sms: ^3.0.1
  sqflite: ^2.3.0
  path: ^1.8.3

  csv: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/4206 LOGO FEEDISENSE-modified.png